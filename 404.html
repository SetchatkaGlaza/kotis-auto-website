<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — АвтоАтелье «КоТиС»</title>
  <!-- Страница самодостаточна: стили внутри, ссылки на главную считаются скриптом
       (на GitHub Pages адрес вида /название-репозитория/, при своём домене — /). -->
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #f4f0e8; background: #0f0e10; }
    main { max-width: 480px; text-align: center; }
    .code { font-size: clamp(5rem, 22vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -.05em; color: #f2992e; }
    h1 { margin: 12px 0 10px; font-size: 1.6rem; line-height: 1.2; }
    p { margin: 0 0 28px; color: #aca59a; }
    a { display: inline-block; padding: 14px 28px; border-radius: 999px; font-weight: 600; color: #1b1208; background: #f2992e; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f2992e; outline-offset: 3px; }
    @media (prefers-color-scheme: light) { body { color: #1a150e; background: #f7f3ec; } p { color: #5f5748; } }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную: там услуги, цены и запись.</p>
    <a id="home" href="/">На главную</a>
  </main>
  <script>
    (function () {
      var host = location.hostname, parts = location.pathname.split("/").filter(Boolean);
      var base = /\.github\.io$/.test(host) && parts.length ? "/" + parts[0] + "/" : "/";
      document.getElementById("home").setAttribute("href", base);
    })();
  </script>
</body>
</html>
