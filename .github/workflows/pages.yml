# Публикация сайта на GitHub Pages при каждом обновлении ветки main.
# Включить один раз: Settings → Pages → Source: «GitHub Actions».
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Собрать папку сайта
        env:
          # Адрес сайта без слэша на конце. Свой домен можно задать в Settings → Variables → SITE_URL.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp -r assets index.html 404.html robots.txt sitemap.xml site.webmanifest .nojekyll _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          SITE_URL="${SITE_URL%/}"
          sed -i "s|__SITE_URL__|${SITE_URL}|g" _site/index.html _site/robots.txt _site/sitemap.xml
          echo "Адрес сайта: ${SITE_URL}"
          if grep -rq "__SITE_URL__" _site; then echo "Остался незамененный __SITE_URL__"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
